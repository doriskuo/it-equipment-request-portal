version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: procurement_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: procurement
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
